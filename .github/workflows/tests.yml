name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No system GTK/GObject-introspection packages needed: `gramps.gen.const`
      # imports `gi.repository.GLib` just to compute a few XDG directories,
      # and tests/_gi_stub.py stubs that out before gramps is ever imported,
      # so plain `pip install gramps` (no PyGObject) is enough here.
      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest tests/ -v
